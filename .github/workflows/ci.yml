name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: CLI — install
        working-directory: cli
        run: npm ci

      - name: CLI — test
        working-directory: cli
        run: npm test

      - name: CLI — build
        working-directory: cli
        run: npm run build

      - name: SDK — install
        working-directory: sdk/node
        run: npm ci

      - name: SDK — test
        working-directory: sdk/node
        run: npm test

      - name: SDK — build
        working-directory: sdk/node
        run: npm run build
